name: Deploy Messenger

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-messenger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
      - name: Deploy Messenger to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
    
            cd /opt/microservices/messenger
            git pull origin main
    
            cd /opt/microservices/microservices-docker
            docker compose up -d --build messenger-service
    
            docker compose ps messenger-service